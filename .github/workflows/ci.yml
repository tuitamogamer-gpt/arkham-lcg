name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Types, rules tests, build and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc -b
      - name: Rules, save, presentation and fuzz tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Serve the production build
        run: |
          npx vite preview --port 5187 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5187/ > /dev/null && break
            sleep 1
          done
      - name: Build optional native developer UI separately
        env:
          VITE_ENABLE_LOCAL_RULES: "true"
        run: npx vite build --outDir dist-native
      - name: Serve optional native UI
        run: |
          npx vite preview --outDir dist-native --port 5188 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5188/ > /dev/null && break
            sleep 1
          done
      - name: Browser smoke test (real clicks through a first turn)
        env:
          BASE_URL: http://127.0.0.1:5187
        run: node scripts/browser-check.mjs
      - name: Review regressions (tutorial, undo, party and save import)
        env:
          BASE_URL: http://127.0.0.1:5187
        run: node --import tsx scripts/review-browser-check.mjs
      - name: Significant-event motion and control independence
        env:
          BASE_URL: http://127.0.0.1:5187
          NATIVE_BASE_URL: http://127.0.0.1:5188
        run: node --import tsx scripts/milestone-browser-check.mjs
      - name: Save recovery, navigation and optional-page failures
        env:
          BASE_URL: http://127.0.0.1:5187
        run: node --import tsx scripts/quality-browser-check.mjs
      - name: Cross-tab save conflicts and unsaved progress
        env:
          BASE_URL: http://127.0.0.1:5187
        run: node --import tsx scripts/save-conflict-browser-check.mjs
      - name: Offline milestone media and lazy player
        env:
          BASE_URL: http://127.0.0.1:5187
        run: node --import tsx scripts/milestone-offline-check.mjs
      - name: Significant Fish audio, mute and offline playback
        env:
          BASE_URL: http://127.0.0.1:5187
        run: node --import tsx scripts/fish-audio-browser-check.mjs
      - name: Browser-only library, search and investigator selection
        env:
          BASE_URL: http://127.0.0.1:5187
        run: node scripts/browser-first-check.mjs
      - name: Campaign continuation and upgrade protocol fixtures
        env:
          BASE_URL: http://127.0.0.1:5188
          QA_BRIDGE_PORT: 5194
          QA_BROWSERS: chromium
        run: node scripts/campaign-continuation-browser-check.mjs
      - name: Keep screenshots when the browser check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check
          path: |
            output/browser
            output/review
            output/milestone-motion
            output/quality-pass
            output/campaign-continuation
            output/save-conflict
            output/browser-first
            output/fish-audio
          if-no-files-found: ignore
